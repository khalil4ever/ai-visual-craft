    <style>
        /* Core Obsidian Theme & Custom Scrollbar */
        :root {
            --bg-obsidian: #050507;
            --violet-glow: #9333ea;
            --lavender: #c29dff;
        }

        body {
            background-color: var(--bg-obsidian);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050507;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(192, 158, 255, 0.25);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(192, 158, 255, 0.5);
        }

        /* Hero Typography Fluid Sizing */
        .hero-headline {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.03em;
            font-size: clamp(2.75rem, 8.2vw, 7.25rem);
            text-transform: uppercase;
        }

        /* ZEDCraft Brand Wordmark Accent */
        .zed-wordmark-accent {
            background: linear-gradient(90deg, #ffffff 0%, #c09eff 55%, #EF7D00 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Soft Lavender Highlight Text */
        .lavender-text {
            color: #c09eff;
            text-shadow: 0 0 38px rgba(168, 85, 247, 0.38);
        }

        /* Liquid Chrome Metallic Text ("REALITY") */
        .chrome-text {
            background: linear-gradient(
                180deg,
                #ffffff 0%,
                #e4e4e7 22%,
                #52525b 48%,
                #ffffff 54%,
                #c09eff 76%,
                #27272a 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 6px 24px rgba(168, 85, 247, 0.28));
        }

        /* Cyber Glass Surfaces */
        .cyber-glass {
            background: rgba(14, 14, 20, 0.58);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .cyber-glass-strong {
            background: rgba(12, 12, 18, 0.78);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        /* Liquid Chrome Primary CTA Button */
        .btn-chrome {
            background: linear-gradient(135deg, #ffffff 0%, #e9d5ff 50%, #c09eff 100%);
            color: #050507;
            box-shadow: 0 0 28px rgba(192, 158, 255, 0.38);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }
        .btn-chrome:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 0 38px rgba(192, 158, 255, 0.62);
            filter: brightness(1.05);
        }
        .btn-chrome:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Equalizer Bar Animation */
        @keyframes eqPulse {
            0%, 100% { transform: scaleY(0.35); opacity: 0.7; }
            50% { transform: scaleY(1); opacity: 1; }
        }
        .eq-bar {
            transform-origin: bottom;
            animation: eqPulse 1.1s ease-in-out infinite;
        }

        /* Slow Wireframe Sphere Rotation */
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spinSlow 24s linear infinite;
        }

        /* Exact Background Art Elastic Jiggle Animation */
        @keyframes artJiggle {
            0%, 100% {
                transform: translate3d(0, 0, 0) scale(1, 1) rotate(0deg);
            }
            25% {
                transform: translate3d(3px, -5px, 0) scale(1.012, 0.992) rotate(0.45deg);
            }
            50% {
                transform: translate3d(-2px, 3px, 0) scale(0.992, 1.01) rotate(-0.35deg);
            }
            75% {
                transform: translate3d(2px, -2px, 0) scale(1.008, 0.995) rotate(0.25deg);
            }
        }
        .bg-art-jiggle {
            animation: artJiggle 3.8s ease-in-out infinite;
            transform-origin: center center;
        }

        /* Custom Range Sliders */
        input[type="range"].cyber-slider {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            outline: none;
        }
        input[type="range"].cyber-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffffff, #c09eff);
            box-shadow: 0 0 12px rgba(192, 158, 255, 0.8);
            cursor: pointer;
        }
    </style>
</head>
